name: Build

# Каждый пуш в main: автотесты → пакет игры, сервер, (APK — только если менялся лаунчер/движок) → релиз «latest».
# Лаунчер на телефонах берёт обновления из релиза, сервер на Hetzner — тоже (таймер umwelt-update).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm *.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.tpz

      # Ключ подписи APK — из секретов репозитория (с 0.23; раньше лежал в кэше Actions, BF-037).
      # Нет секрета или ключ не тот — сборка останавливается: новый ключ НЕ создаётся, иначе APK не встанет поверх старого
      - name: Signing key (from secrets)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_SHA256: "0623ae806820d63821ef2e128d27cd6263a483f21a78801129181397c84ba34c"
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then echo "ОШИБКА: нет ключа подписи в секретах"; exit 1; fi
          mkdir -p ~/keystore
          echo "$KS" | base64 -d > ~/keystore/release.keystore
          echo -n "$KS_PASS" > ~/keystore/pass
          FP=$(keytool -list -v -keystore ~/keystore/release.keystore -storepass "$KS_PASS" -alias umwelt | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$FP" != "$KS_SHA256" ]; then echo "ОШИБКА: ключ из секретов не тот, которым подписаны выпущенные APK"; exit 1; fi
          echo "ключ подписи на месте, отпечаток совпадает"

      # Подпись обновлений (BF-039): тем же ключом подписывается manifest.json; открытая часть ключа — в лаунчер
      - name: Update signing key
        run: |
          PASS=$(cat ~/keystore/pass)
          keytool -importkeystore -srckeystore ~/keystore/release.keystore -srcstorepass "$PASS" -srcalias umwelt \
            -destkeystore ~/keystore/k.p12 -deststoretype PKCS12 -deststorepass "$PASS" -destkeypass "$PASS" -noprompt > /dev/null
          openssl pkcs12 -in ~/keystore/k.p12 -passin pass:"$PASS" -nocerts -nodes -out ~/keystore/key.pem 2>/dev/null
          openssl rsa -in ~/keystore/key.pem -pubout -out ~/keystore/pub.pem 2>/dev/null
          sed -i "s|@UPDATE_PUBLIC_KEY@|$(base64 -w0 ~/keystore/pub.pem)|" launcher/launcher.gd
          if grep -q "@UPDATE_PUBLIC_KEY@" launcher/launcher.gd; then echo "ОШИБКА: ключ не подставлен в лаунчер"; exit 1; fi
          echo "открытый ключ подписи обновлений подставлен в лаунчер"

      - name: Editor settings
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.4.tres editor_settings-4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done

      - name: Version and APK decision
        id: ver
        run: |
          BUILD=${{ github.run_number }}
          sed -i "s/^const BUILD := .*/const BUILD := \"$BUILD\"/" scripts/version.gd
          # «Отпечаток» того, что живёт только в APK: лаунчер, настройки проекта, список class_name, версия Godot
          HASH=$( (cat launcher/* project.godot export_presets.cfg; grep -h "^class_name" scripts/*.gd | sort; echo $GODOT_VERSION) | sha256sum | cut -c1-16)
          curl -fsSL "$REPO_URL/releases/download/latest/manifest.json" -o prev.json || echo '{}' > prev.json
          PREV_HASH=$(python3 -c 'import json; print(json.load(open("prev.json")).get("apk_hash",""))')
          PREV_MIN=$(python3 -c 'import json; print(json.load(open("prev.json")).get("min_apk",0))')
          if [ "$HASH" = "$PREV_HASH" ] && [ "$PREV_MIN" != "0" ]; then
            echo "APK не менялся — оставляю прежний (min_apk=$PREV_MIN)"
            echo "apk=false" >> $GITHUB_OUTPUT; MIN=$PREV_MIN
          else
            echo "APK нужно пересобрать (код $BUILD)"
            echo "apk=true" >> $GITHUB_OUTPUT; MIN=$BUILD
            sed -i "s/^const APK_CODE := .*/const APK_CODE := $BUILD/" launcher/launcher.gd
            sed -i "s/^version\/code=.*/version\/code=$BUILD/; s/^version\/name=.*/version\/name=\"0.$BUILD\"/" export_presets.cfg
          fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "min=$MIN" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      # Импорт ресурсов: Godot при испорченном файле пишет «ERROR: …», но выходит с кодом 0 — проверяем вывод сами
      - name: Import
        run: |
          ~/godot/godot --headless --path . --import > import.log 2>&1 || { tail -30 import.log; echo "ОШИБКА: импорт завершился с ошибкой"; exit 1; }
          tail -3 import.log
          if grep -a "ERROR" import.log; then echo "ОШИБКА: импорт ресурсов не прошёл (строки выше)"; exit 1; fi
          echo "импорт без ошибок"

      - name: Tests
        run: |
          set -o pipefail
          timeout 300 ~/godot/godot --headless --path . -- --audit 2>&1 | grep -vE "JSON|json.cpp" | tee audit.log
          grep -q "ИТОГО: .* 0 ошибок" audit.log
          # ошибка выполнения внутри теста молча обрывает его остаток — такая сборка не выпускается
          if grep -q "SCRIPT ERROR" audit.log; then echo "ОШИБКА: в автотестах ошибка выполнения (SCRIPT ERROR)"; exit 1; fi

      # Настоящая сеть: сервер (без аккаунтов) + 3 бота входят, ходят, видят друг друга, без откатов и замираний
      - name: Network test
        run: |
          XDG_DATA_HOME=$PWD/nt/srv timeout 80 ~/godot/godot --headless --path . -- --server --port=7790 --noauth > nt_server.log 2>&1 &
          SRV=$!
          sleep 4
          pids=""
          for i in 1 2 3; do
            XDG_DATA_HOME=$PWD/nt/c$i timeout 40 ~/godot/godot --headless --path . -- --nettest=Бот$i,7790,2 > nt_c$i.log 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do wait $p || true; done
          # С4, BF-043: с одного адреса без входа — не больше 3 подключений
          timeout 30 ~/godot/godot --headless --path . --script docs/tools/pending_probe.gd -- 7790 2>&1 | grep "держится" | tee probe_ip.log
          grep -q "держится: 3 из 6" probe_ip.log
          # BF-029: остановка службы — запрос файлом, сервер сохраняет мир с игроками и выходит сам с кодом 0
          touch "$PWD/nt/srv/godot/app_userdata/Umwelt RP/stop.request"
          wait $SRV; echo "сервер остановлен, код $?"
          grep -a "остановка по запросу службы: мир сохранён" nt_server.log
          python3 -c "import json,sys; o=json.load(open('nt/srv/godot/app_userdata/Umwelt RP/server_world.json')); n=len(o['p']); print('игроков в сохранённом мире:', n); sys.exit(0 if n == 3 else 1)"
          # BF-047: перезапуск сервера посреди игры — бот переподключается сам (без выхода в меню)
          XDG_DATA_HOME=$PWD/nt/srv timeout 60 ~/godot/godot --headless --path . -- --server --port=7790 --noauth > nt_server2.log 2>&1 &
          SRV=$!
          sleep 4
          XDG_DATA_HOME=$PWD/nt/c4 timeout 90 ~/godot/godot --headless --path . -- --nettest=Бот4,7790,0,reconnect > nt_c4.log 2>&1 &
          BOT=$!
          sleep 14
          touch "$PWD/nt/srv/godot/app_userdata/Umwelt RP/stop.request"
          wait $SRV || true
          sleep 2
          XDG_DATA_HOME=$PWD/nt/srv timeout 60 ~/godot/godot --headless --path . -- --server --port=7790 --noauth > nt_server3.log 2>&1 &
          SRV=$!
          wait $BOT && echo "переподключение: OK" || { grep -a "^\[Бот4" nt_c4.log; echo "ОШИБКА: бот не переподключился"; exit 1; }
          grep -a "^\[Бот4" nt_c4.log
          touch "$PWD/nt/srv/godot/app_userdata/Umwelt RP/stop.request"; wait $SRV || true
          grep -ah "ИТОГ\|прошёл" nt_c*.log
          echo "--- сервер"; grep -a "^\[" nt_server.log | head -20
          if grep -aq "SCRIPT ERROR" nt_c*.log nt_server.log; then echo "ОШИБКА: SCRIPT ERROR в сетевом тесте"; exit 1; fi
          test "$(grep -al "ИТОГ: OK" nt_c1.log nt_c2.log nt_c3.log | wc -l)" = "3"

      # Боевой сервер предъявляет тот сертификат, что вшит в игру (иначе телефоны не подключатся, BF-038)
      - name: Server certificate
        run: |
          timeout 60 ~/godot/godot --headless --path . --script docs/tools/probe_server.gd 2>&1 | grep -v "^Godot Engine" | tee probe.log
          if grep -q "ОШИБКА" probe.log; then exit 1; fi
          grep -q "сертификат\|ПРЕДУПРЕЖДЕНИЕ" probe.log

      - name: Export game pack, server, APK
        run: |
          set -o pipefail
          mkdir -p build/android build/server build/release
          ~/godot/godot --headless --path . --export-pack "Android" build/release/game.pck 2>&1 | tail -5
          ~/godot/godot --headless --path . --export-release "Linux Server" build/server/umwelt-server.x86_64 2>&1 | tail -5
          (cd build/server && zip -q -r ../release/umwelt-server.zip .)
          if [ "${{ steps.ver.outputs.apk }}" = "true" ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=~/keystore/release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=umwelt
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$(cat ~/keystore/pass)
            ~/godot/godot --headless --path . --export-release "Android" build/release/umwelt.apk 2>&1 | tee build.log | tail -5
            test -s build/release/umwelt.apk
          fi
          test -s build/release/game.pck
          test -s build/release/umwelt-server.zip
          # серверный код не должен попасть к игрокам (scripts/server_only/ исключена из экспорта Android)
          for f in build/release/game.pck build/release/umwelt.apk; do
            [ -f "$f" ] || continue
            if unzip -p "$f" 2>/dev/null | grep -a -q "SAVE_BAK" || grep -a -q "SAVE_BAK" "$f"; then
              echo "ОШИБКА: серверный код попал в $f"; exit 1
            fi
          done
          ls -la build/release

      - name: Manifest
        run: |
          python3 - <<PY
          import json, hashlib, os
          def info(p):
              d = open(p, "rb").read()
              return {"size": len(d), "sha256": hashlib.sha256(d).hexdigest()}
          news = open("NEWS.md", encoding="utf-8").read().strip().split("\n")[0] if os.path.exists("NEWS.md") else ""
          m = {
            "build": "${{ steps.ver.outputs.build }}",
            "min_apk": int("${{ steps.ver.outputs.min }}"),
            "apk_hash": "${{ steps.ver.outputs.hash }}",
            "apk_url": "$REPO_URL/releases/download/latest/umwelt.apk",
            "server": {"host": "2.31.45.237", "port": 7777},
            "files": [dict(name="game.pck", **info("build/release/game.pck"))],
            "server_zip": info("build/release/umwelt-server.zip"),
            "news": news,
          }
          json.dump(m, open("build/release/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False, indent=1))
          PY

      - name: Sign manifest
        run: |
          openssl dgst -sha256 -sign ~/keystore/key.pem -out manifest.bin build/release/manifest.json
          base64 -w0 manifest.bin > build/release/manifest.sig
          openssl dgst -sha256 -verify ~/keystore/pub.pem -signature manifest.bin build/release/manifest.json
          ~/godot/godot --headless --path . --script docs/tools/verify_manifest.gd -- build/release/manifest.json build/release/manifest.sig

      - name: Push build log on failure
        if: failure()
        run: |
          mkdir logout && cp build.log audit.log logout/ 2>/dev/null || echo none > logout/none.log
          cd logout && git init -q -b buildlog && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog

      # Сначала пакеты, последним — манифест: телефоны и сервер видят новую сборку, когда файлы уже на месте
      - name: Publish files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Версия 0.${{ github.run_number }} (коммит ${{ github.sha }}).
            ${{ github.event.head_commit.message }}

            Установи umwelt.apk (лаунчер) — он сам скачивает обновления игры.
          make_latest: true
          files: |
            build/release/game.pck
            build/release/umwelt-server.zip
            build/release/umwelt.apk

      - name: Publish manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            build/release/manifest.sig
            build/release/manifest.json
