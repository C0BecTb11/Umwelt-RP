name: Migrate secrets (one-off)

# Разовый перенос (BF-026, закрытый аудит В2): ключ подписи APK — из кэша в секреты репозитория,
# пароль тестового бота — новый случайный, тоже в секрет. Запускается только пушем в ветку secrets-migration
# (основная сборка не трогается). Нужен секрет SECRETS_PAT — временный токен владельца с правом «Secrets: write».
# Значения нигде не печатаются: только названия секретов и отпечаток сертификата (он публичный).
on:
  push:
    branches: [ secrets-migration ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/keystore
          key: umwelt-android-keystore-v1

      - name: Check inputs
        env:
          PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$PAT" ]; then echo "ОШИБКА: нет секрета SECRETS_PAT"; exit 1; fi
          if [ "${{ steps.key.outputs.cache-hit }}" != "true" ] || [ ! -s ~/keystore/release.keystore ] || [ ! -s ~/keystore/pass ]; then
            echo "ОШИБКА: ключа подписи в кэше нет — ничего не переношу"; exit 1
          fi

      - name: Key matches the released APK
        run: |
          PASS=$(cat ~/keystore/pass)
          KEY_FP=$(keytool -list -v -keystore ~/keystore/release.keystore -storepass "$PASS" -alias umwelt | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/latest/umwelt.apk" -o umwelt.apk
          SIGNER=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)apksigner
          APK_FP=$($SIGNER verify --print-certs umwelt.apk | grep -m1 "certificate SHA-256 digest" | sed 's/.*digest: //')
          echo "отпечаток ключа из кэша: $KEY_FP"
          echo "отпечаток вышедшего APK: $APK_FP"
          if [ -z "$KEY_FP" ] || [ "$KEY_FP" != "$APK_FP" ]; then echo "ОШИБКА: ключ в кэше не тот, которым подписан APK"; exit 1; fi
          echo "$KEY_FP" > key_fp.txt

      - name: Write secrets
        env:
          PAT: ${{ secrets.SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          pip install --quiet pynacl
          NEW_BOT=$(openssl rand -base64 24 | tr -d '/+=')
          echo "::add-mask::$NEW_BOT"
          echo -n "$NEW_BOT" > new_bot.txt
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public
          repo, pat = os.environ["REPO"], os.environ["PAT"]
          def api(method, path, body=None):
              req = urllib.request.Request("https://api.github.com/repos/%s/actions/secrets%s" % (repo, path), method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + pat, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req) as r:
                  t = r.read()
                  return json.loads(t) if t else {}
          pk = api("GET", "/public-key")
          box = public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))
          home = os.path.expanduser("~")
          values = {
              "ANDROID_KEYSTORE_B64": base64.b64encode(open(home + "/keystore/release.keystore", "rb").read()).decode(),
              "ANDROID_KEYSTORE_PASS": open(home + "/keystore/pass").read().strip(),
              "BOT_PASSWORD": open("new_bot.txt").read().strip(),
          }
          for name, val in values.items():
              enc = base64.b64encode(box.encrypt(val.encode())).decode()
              api("PUT", "/" + name, {"encrypted_value": enc, "key_id": pk["key_id"]})
              print("записан секрет", name)
          names = [s["name"] for s in api("GET", "?per_page=100")["secrets"]]
          print("секреты репозитория:", ", ".join(sorted(names)))
          missing = [n for n in values if n not in names]
          if missing:
              raise SystemExit("ОШИБКА: не видно секретов " + ", ".join(missing))
          PY

      # Сначала секрет записан, потом меняем пароль: если смена не пройдёт, бот работает со старым паролем
      - name: Change bot password
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' scripts/boot.gd | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' scripts/boot.gd | head -1)
          NEW_BOT=$(cat new_bot.txt)
          TOKEN=$(curl -fsS "$URL/auth/v1/token?grant_type=password" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"email":"bot@umwelt-rp.test","password":"gao0-HhcxoppSYBS"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          curl -fsS -X PUT "$URL/auth/v1/user" -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"password\":\"$NEW_BOT\"}" > /dev/null
          curl -fsS -X POST "$URL/auth/v1/logout?scope=global" -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" > /dev/null || true
          # проверка: новый пароль работает, старый — нет
          curl -fsS "$URL/auth/v1/token?grant_type=password" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"bot@umwelt-rp.test\",\"password\":\"$NEW_BOT\"}" > /dev/null && echo "новый пароль бота работает"
          if curl -fsS "$URL/auth/v1/token?grant_type=password" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"email":"bot@umwelt-rp.test","password":"gao0-HhcxoppSYBS"}' > /dev/null 2>&1; then
            echo "ОШИБКА: старый пароль всё ещё работает"; exit 1
          fi
          echo "старый пароль бота больше не работает"
          echo "ИТОГ: перенос завершён, отпечаток ключа $(cat key_fp.txt)"
