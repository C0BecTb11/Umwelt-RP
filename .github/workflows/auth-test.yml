name: Auth test

# Вход по аккаунту целиком: Supabase (настоящий проект) → локальный игровой сервер.
# Тестовый аккаунт-бот bot@umwelt-rp.test без прав, кроме своего персонажа Test_Bot. Пароль — секрет BOT_PASSWORD (с 0.23, BF-026).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# токену запуска — только чтение кода (аудит 2026-11-09): этим проверкам писать в репозиторий не нужно
permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1
  # SHA-512 файлов Godot из официального SHA512-SUMS.txt релиза 4.4.1 (аудит 2026-11-09, Н9): скачанное сверяется.
  # Меняешь версию Godot — меняй и суммы (во всех трёх workflow)
  GODOT_ZIP_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor-only-sha  # -sha: после 2026-11-09 скачать заново со сверкой суммы
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          echo "$GODOT_ZIP_SHA512  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha512sum -c --quiet - || { echo "ОШИБКА: Godot не совпал с контрольной суммой"; exit 1; }
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm *.zip
      - name: Server + client login
        env:
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          if [ -z "$BOT_PASSWORD" ]; then echo "ОШИБКА: нет секрета BOT_PASSWORD"; exit 1; fi
          ~/godot/godot --headless --path . --import > import.log 2>&1 || { tail -30 import.log; exit 1; }
          if grep -a "ERROR" import.log; then echo "ОШИБКА: импорт ресурсов не прошёл"; exit 1; fi
          XDG_DATA_HOME=$PWD/d1 timeout 60 ~/godot/godot --headless --path . -- --server --port=7795 --nobackup > server.log 2>&1 &
          sleep 4
          set +e
          XDG_DATA_HOME=$PWD/d2 timeout 50 ~/godot/godot --headless --path . -- --no-update --authtest=bot@umwelt-rp.test,$BOT_PASSWORD,7795 2>&1 | tee client.log
          set -e
          echo "--- сервер"; grep -a "^\[" server.log || true
          grep -q "ИТОГ: OK" client.log
          # BF-044: сервер читает журнал удалённых аккаунтов publishable-ключом (функция deleted_accounts)
          for i in $(seq 1 10); do grep -aq "журнал удалённых аккаунтов" server.log && break; sleep 1; done
          grep -a "журнал удалённых аккаунтов" server.log
          grep -aq "журнал удалённых аккаунтов: доступен" server.log
